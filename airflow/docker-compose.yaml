services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    restart: always

  airflow-init:
    build: .
    user: "0:0" # <--- ROOT OVERRIDE ADDED
    depends_on:
      - postgres
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../scripts:/opt/airflow/project/scripts
      - ../dbt:/opt/airflow/project/dbt
      - ../warehouse:/opt/airflow/project/warehouse
      - ../data:/opt/airflow/project/data
    command: >
      bash -c "
      airflow db migrate
      "

  airflow-api-server:
    build: .
    user: "0:0" # <--- ROOT OVERRIDE ADDED
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'
      AIRFLOW__CORE__PARALLELISM: '1'
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '1'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../scripts:/opt/airflow/project/scripts
      - ../dbt:/opt/airflow/project/dbt
      - ../warehouse:/opt/airflow/project/warehouse
      - ../data:/opt/airflow/project/data
    command: api-server

  airflow-scheduler:
    build: .
    user: "0:0" # <--- ROOT OVERRIDE ADDED
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'
      AIRFLOW__CORE__PARALLELISM: '1'
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '1'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../scripts:/opt/airflow/project/scripts
      - ../dbt:/opt/airflow/project/dbt
      - ../warehouse:/opt/airflow/project/warehouse
      - ../data:/opt/airflow/project/data
    command: scheduler

  airflow-dag-processor:
    build: .
    user: "0:0" # <--- ROOT OVERRIDE ADDED
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: always
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../scripts:/opt/airflow/project/scripts
      - ../dbt:/opt/airflow/project/dbt
      - ../warehouse:/opt/airflow/project/warehouse
      - ../data:/opt/airflow/project/data
    command: dag-processor

volumes:
  postgres-db-volume: